# ══════════════════════════════════════════════════════════════
#  Perfil DEMO — Sin honeypots reales activos.
#  Útil para presentaciones y evaluaciones.
#  Arrancar con: docker compose -f docker-compose.demo.yml up -d
# ══════════════════════════════════════════════════════════════
services:
  db:
    image: postgres:15-alpine
    container_name: honeypot_db
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_demo:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./database/seed_quiz.sql:/docker-entrypoint-initdb.d/03_seed_quiz.sql
      - ./database/seed_demo.sql:/docker-entrypoint-initdb.d/04_seed_demo.sql
    networks:
      - honeypot_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: honeypot_backend
    environment:
      DATABASE_URL:                ${DATABASE_URL}
      DATABASE_SYNC_URL:           ${DATABASE_SYNC_URL}
      SECRET_KEY:                  ${SECRET_KEY}
      JWT_ALGORITHM:               ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ADMIN_USERNAME:              ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL:                 ${ADMIN_EMAIL}
      ADMIN_PASSWORD:              ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS:             ${ALLOWED_ORIGINS:-https://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - honeypot_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: honeypot_frontend
    networks:
      - honeypot_net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: honeypot_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - honeypot_net
    restart: unless-stopped

networks:
  honeypot_net:
    driver: bridge

volumes:
  postgres_data_demo:
