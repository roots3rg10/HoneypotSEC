services:
  # ─── Base de datos ────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: honeypot_db
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./database/seed_quiz.sql:/docker-entrypoint-initdb.d/03_seed_quiz.sql
    networks:
      - honeypot_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ──────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: honeypot_backend
    environment:
      DATABASE_URL:                  ${DATABASE_URL}
      DATABASE_SYNC_URL:             ${DATABASE_SYNC_URL}
      SECRET_KEY:                    ${SECRET_KEY}
      JWT_ALGORITHM:                 ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES:   ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ADMIN_USERNAME:                ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL:                   ${ADMIN_EMAIL}
      ADMIN_PASSWORD:                ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS:               ${ALLOWED_ORIGINS:-https://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - honeypot_net
    restart: unless-stopped

  # ─── Colector de logs ─────────────────────────────────────────
  collector:
    build: ./collector
    container_name: honeypot_collector
    environment:
      DATABASE_URL:      ${DATABASE_SYNC_URL}
      SMTP_HOST:         ${SMTP_HOST:-}
      SMTP_PORT:         ${SMTP_PORT:-587}
      SMTP_USER:         ${SMTP_USER:-}
      SMTP_PASSWORD:     ${SMTP_PASSWORD:-}
      SMTP_FROM:         ${SMTP_FROM:-alertas@honeypot.local}
      ALERT_EMAIL_TO:    ${ALERT_EMAIL_TO:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - cowrie_logs:/logs/cowrie:ro
      - dionaea_logs:/logs/dionaea:ro
      - honeytrap_logs:/logs/honeytrap:ro
      - glastopf_logs:/logs/glastopf:ro
      - conpot_logs:/logs/conpot:ro
      - honeyd_logs:/logs/honeyd:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - honeypot_net
    restart: unless-stopped

  # ─── Cowrie (SSH / Telnet) ────────────────────────────────────
  cowrie:
    image: cowrie/cowrie:latest
    container_name: honeypot_cowrie
    ports:
      - "2222:2222"
      - "2323:2323"
    volumes:
      - cowrie_logs:/home/cowrie/var/log/cowrie
      - ./honeypots/cowrie/cowrie.cfg:/home/cowrie/etc/cowrie.cfg:ro
    networks:
      - honeypot_net
    restart: unless-stopped

  # ─── Dionaea (SMB / FTP / HTTP / malware) ────────────────────
  dionaea:
    image: dinotools/dionaea:latest
    container_name: honeypot_dionaea
    ports:
      - "21:21"
      - "42:42"
      - "69:69/udp"
      - "445:445"
      - "1433:1433"
      - "1723:1723"
      - "1883:1883"
      - "3306:3306"
    volumes:
      - dionaea_logs:/opt/dionaea/var/log/dionaea
    networks:
      - honeypot_net
    restart: unless-stopped

  # ─── Honeytrap (TCP/UDP genérico) ────────────────────────────
  honeytrap:
    image: honeytrap/honeytrap:latest
    container_name: honeypot_honeytrap
    volumes:
      - honeytrap_logs:/data
      - ./honeypots/honeytrap/config.toml:/config/config.toml:ro
    networks:
      - honeypot_net
    restart: unless-stopped

  # ─── Glastopf (Web application honeypot) ────────────────────
  glastopf:
    build: ./honeypots/glastopf
    container_name: honeypot_glastopf
    ports:
      - "8080:80"
    volumes:
      - glastopf_logs:/opt/glastopf/log
    networks:
      - honeypot_net
    restart: unless-stopped

  # ─── Conpot (ICS / SCADA) ────────────────────────────────────
  conpot:
    image: honeynet/conpot:latest
    container_name: honeypot_conpot
    ports:
      - "102:102"
      - "502:502"
      - "44818:44818"
    volumes:
      - conpot_logs:/var/log/conpot
    networks:
      - honeypot_net
    restart: unless-stopped

  # ─── Honeyd (red virtual) ────────────────────────────────────
  honeyd:
    build: ./honeypots/honeyd
    container_name: honeypot_honeyd
    volumes:
      - honeyd_logs:/var/log/honeyd
      - ./honeypots/honeyd/honeyd.conf:/etc/honeyd.conf:ro
    cap_add:
      - NET_ADMIN
    networks:
      - honeypot_net
    restart: unless-stopped

  # ─── Backup nocturno ─────────────────────────────────────────
  backup:
    image: postgres:15-alpine
    container_name: honeypot_backup
    environment:
      PGPASSWORD:    ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB:   ${POSTGRES_DB}
    volumes:
      - ./database/backup.sh:/backup.sh
      - ./database/backups:/backups
    command: >
      sh -c "chmod +x /backup.sh &&
             mkdir -p /var/spool/cron/crontabs &&
             echo '0 2 * * * /backup.sh >> /backups/backup.log 2>&1' > /var/spool/cron/crontabs/root &&
             chmod 600 /var/spool/cron/crontabs/root &&
             crond -f -l 8"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - honeypot_net
    restart: unless-stopped

  # ─── Frontend React ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: honeypot_frontend
    networks:
      - honeypot_net
    restart: unless-stopped

  # ─── Nginx (reverse proxy) ───────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: honeypot_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - honeypot_net
    restart: unless-stopped

networks:
  honeypot_net:
    driver: bridge

volumes:
  postgres_data:
  cowrie_logs:
  dionaea_logs:
  honeytrap_logs:
  glastopf_logs:
  conpot_logs:
  honeyd_logs:
