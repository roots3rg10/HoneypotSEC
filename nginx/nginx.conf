# ─── Catch-all: rechaza accesos por IP directa ───────────────
server {
    listen 80  default_server;
    listen 443 default_server ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/honeypotsec.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/honeypotsec.duckdns.org/privkey.pem;

    return 301 https://honeypotsec.duckdns.org$request_uri;
}

# ─── HTTP: ACME challenge + redirect ──────────────────────────
server {
    listen 80;
    server_name honeypotsec.duckdns.org;

    # Let's Encrypt webroot challenge (must be served via HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name honeypotsec.duckdns.org;

    # Certificados Let's Encrypt (gestionados por certbot)
    ssl_certificate     /etc/letsencrypt/live/honeypotsec.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/honeypotsec.duckdns.org/privkey.pem;

    # Configuración TLS robusta
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           DENY                                   always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
    add_header Content-Security-Policy   "upgrade-insecure-requests"            always;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Frontend React
    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host       $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws/ {
        set $upstream_ws http://backend:8000;
        proxy_pass $upstream_ws$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host       $host;
    }
}
